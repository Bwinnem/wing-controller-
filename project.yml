# XcodeGen spec: builds the same sources as WingControl.swiftpm as a regular Xcode project.
# Used by the GitHub Actions build (`xcodegen generate` creates WingControl.xcodeproj).
name: WingControl
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WingControl:
    type: application
    platform: iOS
    sources:
      - path: WingControl.swiftpm
        excludes:
          - Package.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wingcontrol
        PRODUCT_NAME: "WING Control"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "WING Control"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "WING Control talks to your Behringer WING mixer over the local network using OSC."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
